<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Son Solar - Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #e07903;
            text-align: center;
            margin-bottom: 20px;
        }
        h3
         {
            color: oklch(76.771% 0.24672 139.94);
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #e67e22;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #d35400;
        }
        logo {
            display: block;
            margin: 0 auto 20px;
            width: 100px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Registration</h2>
    <hr>
<header>
    <img src="" alt" width="200" height="auto">
  </a>
</header>
    <h3>Sun Son Solar </h3>
    <fieldset>
        <legend>Welcome to Sun Son Solar/Hello po sir Sorry na :<< </legend>
    <form action="/submit-registration" method="POST">
        
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" required placeholder="Gelo large">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="anghelo@example.com">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required placeholder="123-456-7890">
        </div>

        <div class="form-group">
            <label for="service">Services</label>
            <select id="service" name="service" required>
                <option value="">-- Select type of service --</option>
                <option value="residential">Residential Solar Installation</option>
                <option value="commercial">Commercial Solar Solutions</option>
                <option value="maintenance">Maintenance & Repair</option>
                <option value="consultation">Free Energy Consultation</option>
            </select>
        </div>

        <div class="form-group">
            <label for="address">Installation Address</label>
            <input type="text" id="address" name="address" required placeholder="willarey rd pinagbuhatan pasig city">
        </div>

        <button type="submit">Submit Registration</button>
    </form>
</div>

</body>
</html>
